<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Animália Park</title>
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #121212;
        }

        /* Topo Roxo Escuro */
        .header-animalia {
            height: 45px;
            background-color: #4A154B;
            position: relative;
            z-index: 100;
        }

        /* Barra de Filtros Roxo Claro */
        .filtros-superior-container {
            height: 55px;
            background-color: #8C1B91;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
            z-index: 90;
            position: relative;
            overflow-x: auto;
        }

        .filtros-superior-container::-webkit-scrollbar {
            display: none;
        }

        /* Logotipo Flutuante 3D sobreposto */
        .logo-container-central {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 110;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-central-3d {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.4));
        }

        /* Lista de Filtros Estilo Pílula */
        .legenda-lista-horizontal {
            display: flex;
            gap: 15px;
            list-style: none;
            padding: 0;
            margin: 0;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .filtro-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 2px solid transparent;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            flex: 1;
            max-width: 180px;
        }

        .filtro-item.active {
            background: #ffffff;
            color: #7b1fa2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Layout principal do mapa ocupando o restante da tela mobile */
        .layout-principal {
            width: 100%;
            height: calc(100vh - 100px); 
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .mapa-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
        }

        .mapa {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        #imagemMapa {
            display: block;
            pointer-events: none;
            user-select: none;
        }

        #camadaPontos {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ponto {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            pointer-events: auto;
            z-index: 5;
            transition: transform 0.2s;
        }

        .ponto:hover {
            transform: translate(-50%, -50%) scale(1.2);
        }

        .icone-marcador {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        /* Controles Flutuantes de Zoom */
        .zoom-controls {
            position: absolute;
            right: 15px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
        }

        .zoom-controls button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal Inferior (Bottom Sheet) */
        .janela {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: bottom 0.3s ease-in-out;
            z-index: 1000;
            visibility: hidden;
        }

        .janela.ativa {
            bottom: 0;
            visibility: visible;
        }

        .conteudo {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
            position: relative;
            max-height: 70vh;
            overflow-y: auto;
        }

        .barra-arraste {
            width: 40px;
            height: 4px;
            background: #ccc;
            border-radius: 2px;
            margin: 0 auto 15px auto;
        }

        .fechar {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .conteudo h2 { font-size: 18px; color: #222; margin-bottom: 5px; }
        .conteudo h3 { font-size: 14px; color: #6a1b9a; margin-bottom: 15px; }
        .conteudo p { font-size: 14px; color: #444; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- CABEÇALHO ROXO ESCURO -->
    <header class="header-animalia"></header>

    <!-- LOGOTIPO FLUTUANTE CENTRALIZADO (ESTILO 3D) -->
    <div class="logo-container-central">
        <img src="logo-animalia.png" alt="Animália Park Logo" class="logo-central-3d">
    </div>

    <!-- BARRA DE FILTROS SUPERIOR (ROXO CLARO) -->
    <nav class="filtros-superior-container">
        <ul id="legendaListaHorizontal" class="legenda-lista-horizontal">
            <!-- Preenchido via JavaScript -->
        </ul>
    </nav>

    <!-- LAYOUT PRINCIPAL (MAPA) -->
    <main class="layout-principal">
        <div id="mapaContainer" class="mapa-container">
            <div id="mapa" class="mapa">
                <img id="imagemMapa" src="mapa.zoo.png" alt="Mapa do Parque">
                <div id="camadaPontos"></div>
            </div>

            <!-- CONTROLES FLUTUANTES DE ZOOM -->
            <div class="zoom-controls">
                <button onclick="zoomIn()" aria-label="Aumentar Zoom">+</button>
                <button onclick="zoomOut()" aria-label="Diminuir Zoom">−</button>
                <button onclick="resetZoom()" aria-label="Resetar Zoom">⟲</button>
            </div>
        </div>
    </main>

    <!-- MODAL INFERIOR (BOTTOM SHEET) -->
    <div id="janelaLocal" class="janela" onclick="fecharAoClicarFora(event)">
        <div class="conteudo">
            <div class="barra-arraste"></div>
            <button class="fechar" onclick="fecharLocal()" aria-label="Fechar">&times;</button>
            <h2 id="nomeLocal"></h2>
            <h3 id="areaLocal"></h3>
            <p id="descricaoLocal"></p>
        </div>
    </div>

    <script>
        const dadosPark = {
            reserva: {
                imagem: "mapa.zoo.png",
                categoriasLegenda: [
                    { id: 'reserva', texto: 'ANIMÁLIA RESERVA' },
                    { id: 'diversao', texto: 'ANIMÁLIA DIVERSÃO' }
                ],
                pontos: [
                    { id: "AMBULATÓRIO", nome: "🚑 AMBULATÓRIO", area: "Ambulatório / Bombeiros Animália", desc: "Localizado na Vila Animália.", icone: "icons/ambulatorio.png", categoria: "reserva", top: 26, left: 53 },
                    { id: "VILA ANIMALIA", nome: "VILA ANIMÁLIA", area: "Ambiente aconchegante", desc: "🚻 Banheiro / 🥩 Restaurante Savana", icone: "icons/vila.png", categoria: "reserva", top: 20, left: 53 },
                    { id: "DIVERSÃO INDOOR DIV", nome: "🎡 ANIMÁLIA DIVERSÃO", area: "Atrações Mágicas", desc: "Atrações e brinquedos divertidos.", icone: "icons/div.png", categoria: "diversao", top: 21, left: 38 }
                ]
            }
        };

        let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0, isDragging = false, startDistance = 0;

        function atualizarTransformacao() {
            const mapa = document.getElementById("mapa");
            if (!mapa) return;
            mapa.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        function renderizarPontos(categoriaFiltro = 'reserva') {
            const camada = document.getElementById("camadaPontos");
            if (!camada) return;
            camada.innerHTML = "";
            
            dadosPark.reserva.pontos.forEach(ponto => {
                if (ponto.categoria === categoriaFiltro) {
                    const el = document.createElement("div");
                    el.className = "ponto";
                    el.style.top = ponto.top + "%";
                    el.style.left = ponto.left + "%";
                    el.innerHTML = `<img src="${ponto.icone}" alt="${ponto.nome}" class="icone-marcador">`;
                    el.onclick = (e) => { e.stopPropagation(); abrirLocal(ponto); };
                    camada.appendChild(el);
                }
            });
        }

        function atualizarLegendaHorizontal() {
            const lista = document.getElementById("legendaListaHorizontal");
            if (!lista) return;
            lista.innerHTML = "";

            dadosPark.reserva.categoriasLegenda.forEach((cat, index) => {
                const li = document.createElement("li");
                li.className = "filtro-item" + (index === 0 ? " active" : "");
                li.innerText = cat.texto;

                li.onclick = () => {
                    document.querySelectorAll('.filtro-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    renderizarPontos(cat.id);
                };
                lista.appendChild(li);
            });
        }

        function resetZoom() {
            const container = document.getElementById("mapaContainer");
            const imgMapa = document.getElementById("imagemMapa");
            const mapaWrapper = document.getElementById("mapa");
            if (!container || !imgMapa || imgMapa.naturalWidth === 0) return;

            const realWidth = imgMapa.naturalWidth;
            const realHeight = imgMapa.naturalHeight;
            mapaWrapper.style.width = realWidth + "px";
            mapaWrapper.style.height = realHeight + "px";

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            scale = Math.min(containerWidth / realWidth, containerHeight / realHeight);

            pointX = (containerWidth - realWidth * scale) / 2;
            pointY = (containerHeight - realHeight * scale) / 2;
            atualizarTransformacao();
        }

        function inicializarMapa() {
            const imgMapa = document.getElementById("imagemMapa");
            imgMapa.onload = () => { resetZoom(); renderizarPontos('reserva'); };
            imgMapa.src = dadosPark.reserva.imagem;
            if (imgMapa.complete && imgMapa.naturalWidth !== 0) { imgMapa.onload(); }
            atualizarLegendaHorizontal();
        }

        function abrirLocal(ponto) {
            document.getElementById("nomeLocal").innerText = ponto.nome;
            document.getElementById("areaLocal").innerText = ponto.area;
            document.getElementById("descricaoLocal").innerHTML = ponto.desc;
            document.getElementById("janelaLocal").classList.add("ativa");
        }

        function fecharLocal() { document.getElementById("janelaLocal").classList.remove("ativa"); }
        function fecharAoClicarFora(e) { if (e.target.id === "janelaLocal") fecharLocal(); }
        function zoomIn() { scale = Math.min(scale + 0.25, 3.0); atualizarTransformacao(); }
        function zoomOut() { scale = Math.max(scale - 0.25, 0.2); atualizarTransformacao(); }

        document.addEventListener("DOMContentLoaded", () => {
            inicializarMapa();
            const container = document.getElementById("mapaContainer");
            if (!container) return;

            container.addEventListener("mousedown", (e) => {
                isDragging = true; startX = e.clientX - pointX; startY = e.clientY - pointY;
            });
            window.addEventListener("mousemove", (e) => {
                if (!isDragging) return;
                pointX = e.clientX - startX; pointY = e.clientY - startY;
                atualizarTransformacao();
            });
            window.addEventListener("mouseup", () => { isDragging = false; });
            window.addEventListener("resize", resetZoom);
        });
    </script>
</body>
</html>
