<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Animália Park</title>
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #121212;
        }

        /* Topo Roxo Escuro (#4A154B) */
        .header-animalia {
            height: 45px;
            background-color: #4A154B;
            position: relative;
            z-index: 100;
        }

        /* Barra de Filtros Roxo Claro (#8C1B91) */
        .filtros-superior-container {
            height: 55px;
            background-color: #8C1B91;
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 90;
            position: relative;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .filtros-superior-container::-webkit-scrollbar {
            display: none;
        }

        /* Logotipo Flutuante 3D sobreposto */
        .logo-container-central {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 110;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .logo-central-3d {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.4));
        }

        /* Lista de Filtros Estilo Pílula */
        .legenda-lista-horizontal {
            display: flex;
            gap: 10px;
            list-style: none;
            padding: 0 10px;
            margin: 0 auto;
            align-items: center;
            white-space: nowrap;
        }

        .filtro-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            user-select: none;
        }

        .filtro-item.active {
            background: #ffffff;
            color: #7b1fa2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Layout principal do mapa */
        .layout-principal {
            width: 100%;
            height: calc(100vh - 100px); 
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .mapa-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
        }

        .mapa {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
            user-select: none;
        }

        #imagemMapa {
            display: block;
            pointer-events: none;
            user-select: none;
        }

        #camadaPontos {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ponto {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            pointer-events: auto;
            z-index: 5;
            transition: transform 0.2s;
        }

        .ponto:hover {
            transform: translate(-50%, -50%) scale(1.2);
        }

        .icone-marcador {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        /* Marcador de Geolocalização Pulsante */
        .user-marker-container {
            position: absolute;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 9999;
            pointer-events: none;
        }

        .user-marker-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(37, 99, 235, 0.4);
            border-radius: 50%;
            animation: user-pulse 1.8s infinite ease-out;
        }

        .user-marker-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            background-color: #2563eb;
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
        }

        @keyframes user-pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.9;
            }
            100% {
                transform: scale(2.8);
                opacity: 0;
            }
        }

        /* CAIXA DE LEGENDA FLUTUANTE EM LISTA SUSPENSA */
        .painel-legenda-lateral {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 60;
            width: 260px;
            backdrop-filter: blur(5px);
            max-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }

        .legenda-detalhes {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-height: 100%;
            overflow: hidden;
        }

        .legenda-detalhes summary {
            font-family: inherit;
            font-size: 11px;
            color: #4A154B;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
            padding: 12px;
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
            background: transparent;
        }

        .legenda-detalhes summary::after {
            content: '▼';
            font-size: 8px;
            transition: transform 0.2s ease;
            color: #4A154B;
        }

        .legenda-detalhes[open] summary::after {
            transform: rotate(180deg);
        }

        .legenda-detalhes summary::-webkit-details-marker {
            display: none;
        }

        .legenda-corpo-conteudo {
            padding: 0 12px 12px 12px;
            border-top: 1px solid #ddd;
            margin-top: 2px;
            max-height: 170px !important;
            min-height: 50px;
            overflow-y: auto !important; 
            overflow-x: hidden;
            flex-shrink: 1;
        }

        .legenda-corpo-conteudo::-webkit-scrollbar {
            width: 5px;
        }

        .legenda-corpo-conteudo::-webkit-scrollbar-thumb {
            background: #8C1B91;
            border-radius: 4px;
        }

        .legenda-corpo-conteudo::-webkit-scrollbar-track {
            background: #eee;
        }

        .item-legenda-visual {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 11px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 0;
        }

        .item-legenda-visual img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* Controles Flutuantes de Zoom */
        .zoom-controls {
            position: absolute;
            right: 15px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
        }

        .zoom-controls button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal Inferior (Bottom Sheet) */
        .janela {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: bottom 0.3s ease-in-out, visibility 0.3s;
            z-index: 1000;
            visibility: hidden;
        }

        .janela.ativa {
            bottom: 0;
            visibility: visible;
        }

        .conteudo {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
            position: relative;
            max-height: 70vh;
            overflow-y: auto;
        }

        .barra-arraste {
            width: 40px;
            height: 4px;
            background: #ccc;
            border-radius: 2px;
            margin: 0 auto 15px auto;
        }

        .fechar {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .conteudo h2 { font-size: 18px; color: #222; margin-bottom: 5px; }
        .conteudo h3 { font-size: 14px; color: #6a1b9a; margin-bottom: 15px; }
        .conteudo p { font-size: 14px; color: #444; line-height: 1.5; }
    </style>
</head>
<body>

    <header class="header-animalia"></header>

    <div class="logo-container-central">
        <img src="logo-animalia.png" alt="Animália Park Logo" class="logo-central-3d">
    </div>

    <nav class="filtros-superior-container">
        <ul id="legendaListaHorizontal" class="legenda-lista-horizontal"></ul>
    </nav>

    <main class="layout-principal">
        <div id="mapaContainer" class="mapa-container">
            
            <!-- CAIXINHA DE LEGENDA SUSPENSA -->
            <div class="painel-legenda-lateral">
                <details class="legenda-detalhes">
                    <summary>LEGENDA</summary>
                    <div id="conteudoLegendaLateral" class="legenda-corpo-conteudo">
                        <!-- Atualizado dinamicamente via JS -->
                    </div>
                </details>
            </div>

            <!-- O MAPA -->
            <div id="mapa" class="mapa">
                <img id="imagemMapa" src="mapa.zoo.webp" alt="Mapa do Parque">
                <div id="camadaPontos"></div>
                
<!-- O marcador de geolocalização ajustado e pulsando -->
<div id="user-marker" style="position: absolute; width: 45px; height: 45px; transform: translate(-50%, -100%); display: none; z-index: 9999; pointer-events: none;">
    <!-- Anel que pulsa -->
    <div style="position: absolute; width: 100%; height: 100%; background-color: rgba(239, 68, 68, 0.4); border-radius: 50%; top: 0; left: 0; animation: user-pulse-red 1.8s infinite ease-out;"></div>
    <!-- Emoji do Pin centralizado -->
    <div style="position: absolute; width: 100%0; height: 100%; top: 0; left: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5);">📍</div>
</div>
            </div>

            <!-- CONTROLES DE ZOOM -->
            <div class="zoom-controls">
                <button onclick="zoomIn()" aria-label="Aumentar Zoom">+</button>
                <button onclick="zoomOut()" aria-label="Diminuir Zoom">−</button>
                <button onclick="resetZoom()" aria-label="Resetar Zoom">⟲</button>
            </div>

            <!-- Caixinha Flutuante de Progresso do Trajeto -->
            <div id="painel-progresso" style="position: absolute; bottom: 15px; left: 15px; z-index: 50; padding: 12px 16px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-family: sans-serif; font-size: 14px; font-weight: bold; color: #1e293b;">
                📍 Progresso do Trajeto: <span id="progressoTexto" style="color: #2563eb;">Calculando...</span>
            </div>

        </div>
    </main>

    <div id="janelaLocal" class="janela" onclick="fecharAoClicarFora(event)">
        <div class="conteudo">
            <div class="barra-arraste"></div>
            <button class="fechar" onclick="fecharLocal()" aria-label="Fechar">&times;</button>
            <h3 id="tipoLocal"></h3>
            <h2 id="nomeLocal"></h2>
            <p id="areaLocal" style="font-weight: bold; margin-bottom: 8px;"></p>
            <p id="descricaoLocal"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
