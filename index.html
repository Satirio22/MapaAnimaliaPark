<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Animália Park</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; overflow: hidden; }
        
        header { background: #6a0dad; padding: 10px; display: flex; justify-content: center; gap: 10px; z-index: 1001; }
        header button { padding: 8px 20px; border: none; background: #fff; color: #6a0dad; font-weight: bold; cursor: pointer; border-radius: 5px; }
        header button.active { background: #ffcc00; color: #000; }
        
        .main-container { display: flex; flex: 1; position: relative; }
        #mapa { flex: 1; height: 100%; background: #000; }
        
        aside { width: 280px; background: #1e1e1e; padding: 15px; overflow-y: auto; border-left: 2px solid #333; z-index: 1001; }
        aside h3 { margin-bottom: 10px; color: #ffcc00; font-size: 16px; }
        aside ul { list-style: none; }
        aside li { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
        aside li img { width: 22px; height: 22px; object-fit: contain; }
        
        /* Modal / Bottom Sheet */
        #janelaLocal { position: fixed; bottom: -100%; left: 0; width: calc(100% - 280px); background: #222; padding: 20px; transition: bottom 0.3s ease; border-top-left-radius: 15px; border-top-right-radius: 15px; z-index: 2000; border-top: 2px solid #6a0dad; }
        #janelaLocal.ativa { bottom: 0; }
        #janelaLocal h2 { color: #ffcc00; margin-bottom: 5px; }
        #janelaLocal button { background: #ff4444; color: #fff; border: none; padding: 5px 15px; margin-top: 10px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body onclick="fecharAoClicarFora(event)">

    <header class="filtros">
        <button class="active" onclick="trocarMapa('reserva', this)">ANIMÁLIA RESERVA</button>
        <button onclick="trocarMapa('diversao', this)">ANIMÁLIA DIVERSÃO</button>
    </header>

    <div class="main-container">
        <div id="mapa"></div>
        <aside>
            <h3>LEGENDA</h3>
            <ul id="legendaLista"></ul>
        </aside>
    </div>

    <div id="janelaLocal" onclick="event.stopPropagation()">
        <h2 id="nomeLocal"></h2>
        <p id="areaLocal" style="color: #aaa; margin-bottom: 10px;"></p>
        <div id="descricaoLocal"></div>
        <button onclick="fecharLocal()">Fechar</button>
    </div>

    <!-- Script oficial do Google Maps com chamada correta da função -->
    <script>
        function initMap() {
            if (typeof carregarGoogleMapsPronto === 'function') {
                carregarGoogleMapsPronto();
            }
        }
    </script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDlUwfqHC77m26VmJYAUpnjcHnu-SaRnI&callback=initMap"></script>
    <script src="script.js"></script>
</body>
</html>
