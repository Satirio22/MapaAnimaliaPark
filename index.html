<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Animália Park</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO ROXO FIXO NO TOPO -->
    <header class="header-animalia">
        <div class="logo-container">
            <img src="logo-animalia.png" alt="Animália Park Logo" class="logo-central">
        </div>
        
        <nav class="filtros">
            <button class="btn-filtro active" onclick="trocarMapa('reserva', this)">Animália Reserva</button>
            <button class="btn-filtro" onclick="trocarMapa('diversao', this)">Animália Diversão</button>
        </nav>
    </header>

    <!-- LAYOUT PRINCIPAL (MAPA + LEGENDA) -->
    <main class="layout-principal">
        <!-- ÁREA DO MAPA -->
        <div id="mapaContainer" class="mapa-container">
            <!-- A div 'mapa' agora será o container onde o Google Maps vai rodar -->
            <div id="mapa" class="mapa"></div>

            <!-- CONTROLES FLUTUANTES DE ZOOM E LOCALIZAÇÃO PARA CELULAR -->
            <div class="zoom-controls">
                <button onclick="centralizarNoUsuario()" aria-label="Minha Localização" style="background: #8C1B92; color: #fff;">📍</button>
                <button onclick="zoomIn()" aria-label="Aumentar Zoom">+</button>
                <button onclick="zoomOut()" aria-label="Diminuir Zoom">−</button>
                <button onclick="resetZoom()" aria-label="Resetar Zoom">⟲</button>
            </div>
        </div>

        <!-- PAINEL DE LEGENDA LATERAL/INFERIOR -->
        <aside class="legenda-container">
            <h3>Legenda</h3>
            <ul id="legendaLista" class="legenda-lista">
                <!-- Preenchido via Javascript -->
            </ul>
        </aside>
    </main>

    <!-- MODAL INFERIOR (BOTTOM SHEET) -->
    <div id="janelaLocal" class="janela" onclick="fecharAoClicarFora(event)">
        <div class="conteudo">
            <div class="barra-arraste"></div>
            <button class="fechar" onclick="fecharLocal()" aria-label="Fechar">&times;</button>
            <h2 id="nomeLocal"></h2>
            <h3 id="areaLocal"></h3>
            <p id="descricaoLocal"></p>
        </div>
    </div>

<!-- Script da API do Google Maps corrigido -->
    <script>
      (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="ib",r=`inline`,b=window,f=b[c]||(b[c]={}),data=f.maps||(f.maps={}),r=new Set,e=new URLSearchParams,u=`https://maps.${c}apis.com/maps/api/js?`,v=`v=weekly&callback=initMap&key=AIzaSyBDlUwfqHC77m26VmJYAUpnjcHnu-SaRnI`;
      let a0=[v,...h];f.loaderVersion="v";f.load=function(o){return h=h||new Promise(async(s,n)=>{await (a=document.createElement("script"));a.src=`${u}${o.join("&")}`;e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`${u}&`+e;a.onerror=()=>n(new Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)});};})({
        key: "AIzaSyBDlUwfqHC77m26VmJYAUpnjcHnu-SaRnI",
        v: "weekly"
      });
    </script>

    <script src="script.js"></script>
</body>
</html>
