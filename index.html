<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Animália Park</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO ROXO FIXO NO TOPO -->
    <header class="header-animalia">
        <div class="logo-container">
            <img src="logo-animalia.png" alt="Animália Park Logo" class="logo-central">
        </div>
        
        <!-- CAIXA DE TEXTO NORMAL (NÃO É BOTÃO) -->
        <div class="titulo-caixa-texto">
            MAPA INTERATIVO ANIMÁLIA PARK
        </div>
    </header>

    <!-- BARRA DE FILTROS SUPERIOR -->
    <div class="filtros-superior-container">
        <ul id="legendaLista" class="legenda-lista-horizontal">
            <!-- Preenchido via Javascript -->
        </ul>
    </div>

    <!-- LAYOUT PRINCIPAL (APENAS O MAPA) -->
    <main class="layout-principal">
        <div id="mapaContainer" class="mapa-container">
            <div id="mapa" class="mapa">
                <img id="imagemMapa" src="mapa.zoo.png" alt="Mapa do Parque">
                <div id="camadaPontos"></div>
                
                <!-- ÍCONE DA POSIÇÃO DO USUÁRIO -->
                <div id="userLocation" class="user-marker" style="display: none;">
                    <div class="pulsar"></div>
                    🔵
                </div>
            </div>

            <!-- CONTROLES FLUTUANTES DE ZOOM E LOCALIZAÇÃO -->
            <div class="zoom-controls">
                <button onclick="centralizarNoUsuario()" aria-label="Minha Localização" style="background: #8C1B92; color: #fff;">🔵</button>
                <button onclick="zoomIn()" aria-label="Aumentar Zoom">+</button>
                <button onclick="zoomOut()" aria-label="Diminuir Zoom">−</button>
                <button onclick="resetZoom()" aria-label="Resetar Zoom">⟲</button>
            </div>
        </div>
    </main>

    <!-- MODAL INFERIOR (BOTTOM SHEET) -->
    <div id="janelaLocal" class="janela" onclick="fecharAoClicarFora(event)">
        <div class="conteudo">
            <div class="barra-arraste"></div>
            <button class="fechar" onclick="fecharLocal()" aria-label="Fechar">&times;</button>
            <h2 id="nomeLocal"></h2>
            <h3 id="areaLocal"></h3>
            <p id="descricaoLocal"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
