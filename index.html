<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Animália Park</title>
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #121212;
        }

        /* Topo Roxo Escuro (#4A154B) */
        .header-animalia {
            height: 45px;
            background-color: #4A154B;
            position: relative;
            z-index: 100;
        }

        /* Barra de Filtros Roxo Claro (#8C1B91) */
        .filtros-superior-container {
            height: 55px;
            background-color: #8C1B91;
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 90;
            position: relative;
            overflow-x: auto;
            scroll-behavior: smooth;
        }

        .filtros-superior-container::-webkit-scrollbar {
            display: none;
        }

        /* Logotipo Flutuante 3D sobreposto */
        .logo-container-central {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 110;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .logo-central-3d {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.4));
        }

        /* Lista de Filtros Estilo Pílula (Sem ícones, texto branco, selecionado em retângulo branco) */
        .legenda-lista-horizontal {
            display: flex;
            gap: 10px;
            list-style: none;
            padding: 0 10px;
            margin: 0 auto;
            align-items: center;
            white-space: nowrap;
        }

        .filtro-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .filtro-item.active {
            background: #ffffff;
            color: #7b1fa2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Layout principal do mapa ocupando o restante da tela mobile */
        .layout-principal {
            width: 100%;
            height: calc(100vh - 100px); 
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .mapa-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
        }

        .mapa {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        #imagemMapa {
            display: block;
            pointer-events: none;
            user-select: none;
        }

        #camadaPontos {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ponto {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            pointer-events: auto;
            z-index: 5;
            transition: transform 0.2s;
        }

        .ponto:hover {
            transform: translate(-50%, -50%) scale(1.2);
        }

        .icone-marcador {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        /* Controles Flutuantes de Zoom */
        .zoom-controls {
            position: absolute;
            right: 15px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
        }

        .zoom-controls button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal Inferior (Bottom Sheet) */
        .janela {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: bottom 0.3s ease-in-out;
            z-index: 1000;
            visibility: hidden;
        }

        .janela.ativa {
            bottom: 0;
            visibility: visible;
        }

        .conteudo {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
            position: relative;
            max-height: 70vh;
            overflow-y: auto;
        }

        .barra-arraste {
            width: 40px;
            height: 4px;
            background: #ccc;
            border-radius: 2px;
            margin: 0 auto 15px auto;
        }

        .fechar {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .conteudo h2 { font-size: 18px; color: #222; margin-bottom: 5px; }
        .conteudo h3 { font-size: 14px; color: #6a1b9a; margin-bottom: 15px; }
        .conteudo p { font-size: 14px; color: #444; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- CABEÇALHO ROXO ESCURO -->
    <header class="header-animalia"></header>

    <!-- LOGOTIPO FLUTUANTE CENTRALIZADO (ESTILO 3D) -->
    <div class="logo-container-central">
        <img src="logo-animalia.png" alt="Animália Park Logo" class="logo-central-3d">
    </div>

    <!-- BARRA DE FILTROS SUPERIOR (ROXO CLARO) -->
    <nav class="filtros-superior-container">
        <ul id="legendaListaHorizontal" class="legenda-lista-horizontal">
            <!-- Preenchido via JavaScript com as categorias originais -->
        </ul>
    </nav>

    <!-- LAYOUT PRINCIPAL (MAPA) -->
    <main class="layout-principal">
        <div id="mapaContainer" class="mapa-container">
            <div id="mapa" class="mapa">
                <img id="imagemMapa" src="mapa.zoo.png" alt="Mapa do Parque">
                <div id="camadaPontos"></div>
            </div>

            <!-- CONTROLES FLUTUANTES DE ZOOM -->
            <div class="zoom-controls">
                <button onclick="zoomIn()" aria-label="Aumentar Zoom">+</button>
                <button onclick="zoomOut()" aria-label="Diminuir Zoom">−</button>
                <button onclick="resetZoom()" aria-label="Resetar Zoom">⟲</button>
            </div>
        </div>
    </main>

    <!-- MODAL INFERIOR (BOTTOM SHEET) -->
    <div id="janelaLocal" class="janela" onclick="fecharAoClicarFora(event)">
        <div class="conteudo">
            <div class="barra-arraste"></div>
            <button class="fechar" onclick="fecharLocal()" aria-label="Fechar">&times;</button>
            <h2 id="nomeLocal"></h2>
            <h3 id="areaLocal"></h3>
            <p id="descricaoLocal"></p>
        </div>
    </div>

    <script>
        const dadosPark = {
            reserva: {
                imagem: "mapa.zoo.png",
                categoriasLegenda: [
                    { id: 'todos', texto: 'TODOS' },
                    { id: 'alimentacao', texto: 'ALIMENTAÇÃO' },
                    { id: 'banheiros', texto: 'BANHEIROS' },
                    { id: 'animais', texto: 'ZOOLOGICO' },
                    { id: 'outros', texto: 'OUTROS / SERVIÇOS' }
                ],
                pontos: [

                 //Outros / Serviçocs//
                    { id: "AMBULATÓRIO", nome: "AMBULATÓRIO", area: "Ambulatório Animália Park", desc: "Localizado na Vila Animália.", icone: "icons/ambulatorio.png", categoria: "outros", top: 26, left: 53 },
                    { id: "ESTACIONAMENTO2", nome: "ESTACIONAMENTO", area: "Estacionamento seguro e com Transfer", desc: "🚗Vagas Comuns<br>♿Vagas Acessiveis<br>", icone: "icons/estacionamento.png", categoria: "outros", top: 76, left: 46 }
                    { id: "ESTACIONAMENTO1", nome: "ESTACIONAMENTO", area: "Vaga garantida e seu carro assegurado!", desc: "🚗Vagas Comuns<br>♿Vagas Acessiveis<br>🪫Vagas para Carros Eletrificados<br>", icone: "icons/estacionamento.png", categoria: "outros", top: 40, left: 28 },

                 //Banheiros//
                    { id: "BANHEIROS", nome: "WC RECEPÇÃO", area: "Recepção", desc: "Localizado na Vila Animália.", icone: "banheiro.png", categoria: "banheiros", top: 26, left: 53 },
                    { id: "FOOD PARK", nome: "WC FOOD PARK", area: "Natureza e uma boa alimentação", desc: "🚻Banheiro (Comum e Acessivel)", icone: "banheiro.png", categoria: "banheiros", top: 60.5, left: 70.5 },
                    { id: "VILA ANIMALIA", nome: "WC VILA ANIMÁLIA", area: "Ambiente aconchegante para uma refeições e garantir uma lembrança", desc: "🚻Banheiro (Comum e Acessivel)", icone: "banheiro.png", categoria: "banheiros", top: 20, left: 53 },
                    { id: "RESTAURANTE CENTRAL", nome: "WC RESTAURANTE CENTRAL", area: "Buffet a Vontade", desc: "🚻Banheiro (Comum e Acessivel)", icone: "banheiro.png", categoria: "banheiro", top: 45.5, left: 55.5 },
                    { id: "FAZENDINHA", nome: "WC FAZENDINHA", area: "Ambiente aconchegante para uma refeições e garantir uma lembrança", desc: "🚻Banheiro (Comum e Acessivel)", icone: "banheiro.png", categoria: "banheiro", top: 82, left: 65 },
                    { id: "RECEPÇÃO", nome: "WC RECEPÇÃO", area: "Onde tudo começa e aonde damos um até breve!", desc: "🔁Entrada/Saida<br>🚻Banheiro (Comum e Acessivel)", icone: "banheiro.png", categoria: "banheiro", top: 27, left: 48 },
                    { id: "AVIÁRIO", nome: "WC AVIÁRIO", area: "Um dos Maiores Aviarios da America Latina", desc: "🚻Banheiro (Comum e Acessivel)", icone: "banheiro.png", categoria: "banheiro", top: 60, left: 33 },
                    { id: "DIVERSÃO INDOOR A&B", nome: "WC DIV INDOOR", area: "Diversão e refeição, tudo em um só lugar!", desc: "🚻Banheiro (Comum e Acessivel)", icone: "banheiro.png", categoria: "banheiro", top: 17, left: 35 },

                
                 //alimentação//
                    { id: "quiosque-leao", nome: "QUIOSQUE LEÃO", area: "🍿 Café, Salgados e pipocas", desc: "Logo após o recinto do Leão.", icone: "icons/quiosque.png", categoria: "alimentacao", top: 49, left: 41 },
                    { id: "quiosque-sucuarana", nome: "QUIOSQUE SUÇUARANA", area: "🍿 Salgados e pipocas", desc: "Em frente ao recinto Suçuarana.", icone: "icons/quiosque.png", categoria: "alimentacao", top: 64, left: 43 },
                    { id: "quiosque-tamandua", nome: "QUIOSQUE TAMANDUÁ", area: "🍿 Café, Salgados e pipocas", desc: "Localizado em frente ao recinto tamanduá.", icone: "icons/quiosque.png", categoria: "alimentacao", top: 60, left: 56 },
                    { id: "quiosque-lobo-marinho", nome: "QUIOSQUE LOBO MARINHO", area: "🍿 Café, Salgados e pipocas", desc: "Localizado na Reserva.", icone: "icons/quiosque.png", categoria: "alimentacao", top: 80, left: 80 },
                    { id: "quiosque-canguru", nome: "QUIOSQUE CANGURU", area: "🍿 Café, Salgados e pipocas.", desc: "Localizado na Reserva.", icone: "icons/quiosque.png", categoria: "alimentacao", top: 40, left: 74.5 },
                    { id: "FOOD PARK", nome: "FOOD PARK", area: "Natureza e uma boa alimentação", desc: "🚻Banheiro (Comum e Acessivel)<br>🍖Espetaria/Linguiçaria<br>🍗Chicken & Fries<br>🥟Pastelaria<br>🍜Yakissoba<br>", icone: "icons/food-park.png", categoria: "alimentacao", top: 60.5, left: 70.5 },
                    { id: "VILA ANIMALIA", nome: "VILA ANIMÁLIA", area: "Ambiente aconchegante para uma refeições e garantir uma lembrança", desc: "🚻Banheiro (Comum e Acessivel)<br>🧸Vila Adventure (Souvenier)<br>🧸Baby Zoo (Souvenier)<br>🥩Restaurante Savana (Carnes nobres)<br>🥤Shake do Bin (Sorvetes e Shakes)<br>☕Vila Cafeteria (Cafés e salgados)<br>🍔Hamburgueria da Vila (Burgues e bebidas)<br>🍕Selva de Sabores (Pizzas e Crespes)<br>🍝Vila Tratoria (Massas e Carnes)<br>🌭Hot Dog do Kiran (Hot Dog's)<br>🍨Cantinho da Girafa (Sorvetes e massas)<br>🚑Ambulatório (Saude e Bombeiros)<br>🚠Vila Estação. (Teleférico)<br>", icone: "icons/vila.png", categoria: "alimentacao", top: 20, left: 53 },
                    { id: "RESTAURANTE CENTRAL", nome: "RESTAURANTE CENTRAL", area: "Buffet a Vontade", desc: "🚻Banheiro (Comum e Acessivel)<br> 🍽️Restaurante Baboá (Buffet por Pessoa)<br> 🦋Jardim das Borboletas (Area de Descanso)<br>", icone: "icons/rest.central.png", categoria: "alimentacao", top: 45.5, left: 55.5 },
                    { id: "FAZENDINHA", nome: "FAZENDINHA", area: "Ambiente aconchegante para uma refeições e garantir uma lembrança", desc: "🚻Banheiro (Comum e Acessivel)<br>🍿Quiósque Fazendinha (Doces e Bebidas)<br>🧸Estação Souvenier (Ursinhos e lembrancinhas)<br>🍔Hamburgueria Teleférico (Burgues e bebidas)<br>🚠Estação Teleférico (Vai e Vola ou só vai)<br>", icone: "icons/fazenda.png", categoria: "animais", top: 82, left: 65 },
                    { id: "RECEPÇÃO", nome: "RECEPÇÃO", area: "Onde tudo começa e aonde damos um até breve!", desc: "🔁Entrada/Saida<br>🚻Banheiro (Comum e Acessivel)<br>🧑‍‍💻SAV (Serviço de Atendimento ao Visitante)<br>☕Cafeteria (Cafés e salgados)<br>🧸Animalia Adventure (Souvenier)<br>📸Fotografica (Retirada de Fotos)<br>", icone: "icons/recepçao.png", categoria: "outros", top: 27, left: 48 },
                    { id: "AVIÁRIO", nome: "AVIÁRIO", area: "Um dos Maiores Aviarios da America Latina", desc: "🚻Banheiro (Comum e Acessivel)<br>☕Cafá Caverna (Cafés e salgados)<br>🪿Aviário (Passaros e Natureza)<br>", icone: "icons/Aviario.png", categoria: "animais", top: 60, left: 33 },
                    { id: "DIVERSÃO INDOOR A&B", nome: "🍟🍔 ANIMALIA ALIMENTAÇÃO", area: "Diversão e refeição, tudo em um só lugar!", desc: "🚻Banheiro (Comum e Acessivel)<br>🍔 Cesta Pic Nic (Burgues e bebidas).<br>☕Carrossel (Porções e Cafés).<br>🥮Mundo Doce (Doces e Bebidas).<br>🍿Carrinho de Doce e Pipoca.(Vai um docinho ai?)", icone: "icons/div-ab.png", categoria: "alimentacao", top: 17, left: 35 },



                    { id: "DIVERSÃO INDOOR DIV", nome: "🎡 ANIMALIA DIVERSÃO", area: "Atrações Magicas e divertidas!", desc: "🚻Banheiro (Comum e Acessivel)<br> 🐸Vitoria Regia<br>🛩️Eagle Flight (Aviãozinho)<br>🎈Balão Mexicano<br>👒Forte Apache (Trenzinho)<br>🦘Kanguroo Joy<br>🦒Giraffe Cool<br>🎠Bella Giostra (Carrosel)<br>🩻Joe Caveira<br>🧗Kite Dragon<br>🍭Mundo Doce<br>⛵Rise of Rome<br>🥶Bear Mountain<br>🏎️Big Chock (bate-bate)<br>🧩Cantinho do Silencio (Para Pessoas neurodivergentes)<br>🧸Diversão Adventure (Souvenier)<br>", icone: "icons/div.png", categoria: "outros", top: 21, left: 38 },
                    { id: "DIVERSAO AVENTURA", nome: "🎢 ANIMALIA AVENTURA", area: "Atrações Radicaaaaais!", desc: "🚻Banheiro (Comum e Acessivel)<br> ⛵Barco Viking (Aqui tem que gritar)<br>💧Splash (Aguaaaa)<br>🥶Cyber Hawk (De ponta cabeça)<br>🎢Cyclone (Intensidade e aventura)<br>🐀Big Air Coaster (Essa é leve)<br>🔫Aqua Combat (Combate aquatico)<br>", icone: "icons/div.png", categoria: "outros", top: 10, left: 40 },
                ]
            }
        };

        let scale = 1, pointX = 0, pointY = 0, startX = 0, startY = 0, isDragging = false;

        function atualizarTransformacao() {
            const mapa = document.getElementById("mapa");
            if (!mapa) return;
            mapa.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        function renderizarPontos(categoriaFiltro = 'todos') {
            const camada = document.getElementById("camadaPontos");
            if (!camada) return;
            camada.innerHTML = "";
            
            dadosPark.reserva.pontos.forEach(ponto => {
                if (categoriaFiltro === 'todos' || ponto.categoria === categoriaFiltro) {
                    const el = document.createElement("div");
                    el.className = "ponto";
                    el.style.top = ponto.top + "%";
                    el.style.left = ponto.left + "%";
                    el.innerHTML = `<img src="${ponto.icone}" alt="${ponto.nome}" class="icone-marcador">`;
                    el.onclick = (e) => { e.stopPropagation(); abrirLocal(ponto); };
                    camada.appendChild(el);
                }
            });
        }

        function atualizarLegendaHorizontal() {
            const lista = document.getElementById("legendaListaHorizontal");
            if (!lista) return;
            lista.innerHTML = "";

            dadosPark.reserva.categoriasLegenda.forEach((cat, index) => {
                const li = document.createElement("li");
                li.className = "filtro-item" + (index === 0 ? " active" : "");
                li.innerText = cat.texto;

                li.onclick = () => {
                    document.querySelectorAll('.filtro-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    renderizarPontos(cat.id);
                };
                lista.appendChild(li);
            });
        }

        function resetZoom() {
            const container = document.getElementById("mapaContainer");
            const imgMapa = document.getElementById("imagemMapa");
            const mapaWrapper = document.getElementById("mapa");
            if (!container || !imgMapa || imgMapa.naturalWidth === 0) return;

            const realWidth = imgMapa.naturalWidth;
            const realHeight = imgMapa.naturalHeight;
            mapaWrapper.style.width = realWidth + "px";
            mapaWrapper.style.height = realHeight + "px";

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            scale = Math.min(containerWidth / realWidth, containerHeight / realHeight);

            pointX = (containerWidth - realWidth * scale) / 2;
            pointY = (containerHeight - realHeight * scale) / 2;
            atualizarTransformacao();
        }

        function inicializarMapa() {
            const imgMapa = document.getElementById("imagemMapa");
            imgMapa.onload = () => { resetZoom(); renderizarPontos('todos'); };
            imgMapa.src = dadosPark.reserva.imagem;
            if (imgMapa.complete && imgMapa.naturalWidth !== 0) { imgMapa.onload(); }
            atualizarLegendaHorizontal();
        }

        function abrirLocal(ponto) {
            document.getElementById("nomeLocal").innerText = ponto.nome;
            document.getElementById("areaLocal").innerText = ponto.area;
            document.getElementById("descricaoLocal").innerHTML = ponto.desc;
            document.getElementById("janelaLocal").classList.add("ativa");
        }

        function fecharLocal() { document.getElementById("janelaLocal").classList.remove("ativa"); }
        function fecharAoClicarFora(e) { if (e.target.id === "janelaLocal") fecharLocal(); }
        function zoomIn() { scale = Math.min(scale + 0.25, 3.0); atualizarTransformacao(); }
        function zoomOut() { scale = Math.max(scale - 0.25, 0.2); atualizarTransformacao(); }

        document.addEventListener("DOMContentLoaded", () => {
            inicializarMapa();
            const container = document.getElementById("mapaContainer");
            if (!container) return;

            container.addEventListener("mousedown", (e) => {
                isDragging = true; startX = e.clientX - pointX; startY = e.clientY - pointY;
            });
            window.addEventListener("mousemove", (e) => {
                if (!isDragging) return;
                pointX = e.clientX - startX; pointY = e.clientY - startY;
                atualizarTransformacao();
            });
            window.addEventListener("mouseup", () => { isDragging = false; });
            window.addEventListener("resize", resetZoom);
        });
    </script>
</body>
</html>
