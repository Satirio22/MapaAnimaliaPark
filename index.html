<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Animália Park</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; overflow: hidden; }
        
        /* Cabeçalho com as cores corretas */
        header { background: #512da8; padding: 12px; display: flex; justify-content: center; gap: 15px; z-index: 1001; border-bottom: 2px solid #311b92; }
        header button { padding: 8px 25px; border: none; background: #fff; color: #512da8; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 14px; transition: 0.2s; }
        header button.active { background: #ffeb3b; color: #000; }
        
        .main-container { display: flex; flex: 1; position: relative; overflow: hidden; }
        
        /* Área do Mapa limpa, focada exclusivamente na imagem correta do parque */
        #mapa { flex: 1; height: 100%; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        #imgParque {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: grab;
        }

        /* Legenda lateral */
        aside { width: 300px; background: #1e1e1e; padding: 15px; overflow-y: auto; border-left: 2px solid #333; z-index: 1001; }
        aside h3 { margin-bottom: 12px; color: #ffeb3b; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        aside ul { list-style: none; }
        aside li { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
        aside li img { width: 24px; height: 24px; object-fit: contain; }

        /* Marcadores interativos sobre a imagem do mapa */
        .ponto-marcador {
            position: absolute;
            width: 32px;
            height: 32px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s;
        }
        .ponto-marcador:hover {
            transform: translate(-50%, -50%) scale(1.2);
        }
        .ponto-marcador img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
        }

        /* Layout Dinâmico (Painel / Janela de Informações) */
        #janelaLocal {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: calc(100% - 300px);
            background: #212121;
            padding: 25px;
            transition: bottom 0.3s ease-in-out;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 2000;
            border-top: 3px solid #512da8;
            box-shadow: 0px -5px 20px rgba(0,0,0,0.5);
        }
        #janelaLocal.ativa { bottom: 0; }
        #janelaLocal h2 { color: #ffeb3b; margin-bottom: 8px; font-size: 20px; }
        #janelaLocal p { color: #ccc; font-size: 14px; margin-bottom: 8px; }
        #janelaLocal .descricao { color: #fff; font-size: 15px; margin-bottom: 15px; background: #2c2c2c; padding: 10px; border-radius: 6px; }
        #janelaLocal button { background: #e53935; color: #fff; border: none; padding: 8px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        #janelaLocal button:hover { background: #c62828; }
    </style>
</head>
<body onclick="fecharAoClicarFora(event)">

    <header class="filtros">
        <button class="active" onclick="trocarMapa('reserva', this)">ANIMÁLIA RESERVA</button>
        <button onclick="trocarMapa('diversao', this)">ANIMÁLIA DIVERSÃO</button>
    </header>

    <div class="main-container">
        <div id="mapa" onclick="event.stopPropagation()">
            <!-- Imagem e pontos gerados dinamicamente via script -->
            <img id="imgParque" src="" alt="Mapa do Parque">
            <div id="camadaMarcadores" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
        </div>
        
        <aside>
            <h3>LEGENDA</h3>
            <ul id="legendaLista"></ul>
        </aside>
    </div>

    <!-- Layout dinâmico inferior para abrir os detalhes -->
    <div id="janelaLocal" onclick="event.stopPropagation()">
        <h2 id="nomeLocal"></h2>
        <p id="areaLocal"></p>
        <div id="descricaoLocal" class="descricao"></div>
        <button onclick="fecharLocal()">Fechar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
