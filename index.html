<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Animália Park</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO ROXO FIXO NO TOPO -->
    <header class="header-animalia">
        <div class="logo-container">
            <img src="logo-animalia.png" alt="Animália Park Logo" class="logo-central">
        </div>
        
        <nav class="filtros">
            <button class="btn-filtro active" onclick="filtrarCategoria('todos', this)">Todos</button>
            <button class="btn-filtro" onclick="filtrarCategoria('banheiro', this)">🚻 Banheiros</button>
            <button class="btn-filtro" onclick="filtrarCategoria('animal', this)">🦁 Animais</button>
            <button class="btn-filtro" onclick="filtrarCategoria('alimentacao', this)">🍔 Alimentação</button>
            <button class="btn-filtro" onclick="filtrarCategoria('atracao', this)">🎢 Atrações</button>
            <button class="btn-filtro" onclick="filtrarCategoria('outro', this)">ℹ️ Outros</button>
        </nav>
    </header>

    <!-- LAYOUT PRINCIPAL (MAPA + LEGENDA) -->
    <main class="layout-principal">
        <!-- ÁREA DO MAPA (GOOGLE MAPS + OVERLAY) -->
        <div id="mapaContainer" class="mapa-container">
            <div id="mapaGoogle" style="width: 100%; height: 100%;"></div>

            <!-- CONTROLES FLUTUANTES DE ZOOM E LOCALIZAÇÃO PARA CELULAR -->
            <div class="zoom-controls">
                <button onclick="centralizarNoUsuario()" aria-label="Minha Localização" style="background: #8C1B92; color: #fff;">📍</button>
                <button onclick="zoomIn()" aria-label="Aumentar Zoom">+</button>
                <button onclick="zoomOut()" aria-label="Diminuir Zoom">−</button>
                <button onclick="resetZoom()" aria-label="Resetar Zoom">⟲</button>
            </div>
        </div>

        <!-- PAINEL DE LEGENDA LATERAL/INFERIOR -->
        <aside class="legenda-container">
            <h3>Legenda</h3>
            <ul id="legendaLista" class="legenda-lista">
                <!-- Preenchido via Javascript -->
            </ul>
        </aside>
    </main>

    <!-- MODAL INFERIOR (BOTTOM SHEET) -->
    <div id="janelaLocal" class="janela" onclick="fecharAoClicarFora(event)">
        <div class="conteudo">
            <div class="barra-arraste"></div>
            <button class="fechar" onclick="fecharLocal()" aria-label="Fechar">&times;</button>
            <h2 id="nomeLocal"></h2>
            <h3 id="areaLocal"></h3>
            <p id="descricaoLocal"></p>
        </div>
    </div>

    <!-- Script do Google Maps -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDo7wHBP2dfVukINV6XMxRAP0XOI-R7mzo
"></script>
    
    <script src="script.js"></script>
</body>
</html>
